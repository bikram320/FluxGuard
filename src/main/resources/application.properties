spring.application.name=FluxGuard

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Redis
spring.data.redis.url=${REDIS_URL}
spring.data.redis.ssl.enabled=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# CORS
cors.allowed-origins=${FRONTEND_URL}

# Rate limiting
security.rate-limit.limit-per-minute=60
security.rate-limit.strict-limit-per-minute=10

# Geo-blocking  comma-separated ISO codes, empty = disabled
security.geo-block.blocked-countries=

# Suspicious behavior thresholds
security.suspicious.max-errors-per-window=20
security.suspicious.max-endpoint-hits=30
# Reduce startup overhead
spring.main.lazy-initialization=true

# Cleaner logging
spring.main.banner-mode=off
logging.level.org.springframework=warn

server.port=8080